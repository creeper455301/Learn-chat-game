<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beangame: The Bean Clicker Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        #score {
            font-size: 24px;
            margin: 20px;
            color: #007BFF;
        }
        #bean {
            width: 150px;
            height: 150px;
            background-color: #4CAF50;
            border-radius: 50%;
            margin-top: 50px;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }
        #bean:hover {
            transform: scale(1.1);
        }
        #home-button {
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }
        #home-button:hover {
            background-color: #0056b3;
        }
        .shop-item {
            margin-top: 30px;
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: inline-block;
            width: 200px;
            margin-bottom: 20px;
        }
        .shop-item h3 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }
        .shop-item p {
            font-size: 14px;
            color: #555;
        }
        .shop-item button {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        .shop-item button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .shop-item .upgrade-btn {
            background-color: #ffc107;
        }
        .shop-item .upgrade-btn:disabled {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <h1>Welcome to Beangame!</h1>
    <p>Click the bean to increase your score!</p>
    
    <div id="score">Score: 0</div>
    
    <!-- The clickable bean -->
    <div id="bean"></div>
    
    <!-- Shop section -->
    <h2>Shop</h2>
    <!-- Bean Factory -->
    <div class="shop-item" id="bean-factory-item">
        <h3>Bean Factory</h3>
        <p>Cost: 50 Beans</p>
        <p>Generates <span id="bean-factory-rate">1</span> bean per second!</p>
        <button id="buy-bean-factory" onclick="buyFactory('beanFactory')">Buy Bean Factory</button>
        <button id="upgrade-bean-factory" class="upgrade-btn" onclick="upgradeFactory('beanFactory')" disabled>Upgrade Factory</button>
    </div>
    
    <!-- Green Bean Factory -->
    <div class="shop-item" id="green-bean-factory-item">
        <h3>Green Bean Factory</h3>
        <p>Cost: 150 Beans</p>
        <p>Generates <span id="green-bean-factory-rate">2</span> beans per second!</p>
        <button id="buy-green-bean-factory" onclick="buyFactory('greenBeanFactory')">Buy Green Bean Factory</button>
        <button id="upgrade-green-bean-factory" class="upgrade-btn" onclick="upgradeFactory('greenBeanFactory')" disabled>Upgrade Factory</button>
    </div>

    <!-- Baked Bean Factory -->
    <div class="shop-item" id="baked-bean-factory-item">
        <h3>Baked Bean Factory</h3>
        <p>Cost: 300 Beans</p>
        <p>Generates <span id="baked-bean-factory-rate">5</span> beans per second!</p>
        <button id="buy-baked-bean-factory" onclick="buyFactory('bakedBeanFactory')">Buy Baked Bean Factory</button>
        <button id="upgrade-baked-bean-factory" class="upgrade-btn" onclick="upgradeFactory('bakedBeanFactory')" disabled>Upgrade Factory</button>
    </div>

    <!-- Button to go back to the homepage -->
    <br><br>
    <a href="Beanstart.html" id="home-button">Back to Beanstart</a>
    
    <script>
        let score = 0;
        let factoryCosts = {
            beanFactory: 50,
            greenBeanFactory: 150,
            bakedBeanFactory: 300
        };
        let factoryGenerationRates = {
            beanFactory: 1,
            greenBeanFactory: 2,
            bakedBeanFactory: 5
        };
        let activeFactories = {
            beanFactory: 0,
            greenBeanFactory: 0,
            bakedBeanFactory: 0
        };
        let factoryUpgradeCosts = {
            beanFactory: 100,
            greenBeanFactory: 200,
            bakedBeanFactory: 500
        };
        let factoryUpgradeLevels = {
            beanFactory: 0,
            greenBeanFactory: 0,
            bakedBeanFactory: 0
        };

        const scoreDisplay = document.getElementById('score');
        const bean = document.getElementById('bean');

        // Update the score
        function updateScore() {
            score++;
            scoreDisplay.textContent = "Score: " + score;

            // Add bobbing animation to the bean
            bean.classList.add('bobbing');
            setTimeout(() => {
                bean.classList.remove('bobbing');
            }, 500);  // 500ms to match the animation duration
        }

        // When the bean is clicked, increase the score
        bean.addEventListener('click', updateScore);

        // Buy Factory
        function buyFactory(factoryType) {
            if (score >= factoryCosts[factoryType]) {
                score -= factoryCosts[factoryType];
                activeFactories[factoryType]++;
                scoreDisplay.textContent = "Score: " + score;

                // Start generating beans from this factory
                startFactory(factoryType);

                document.getElementById(`buy-${factoryType}`).disabled = true;
                document.getElementById(`buy-${factoryType}`).textContent = `${factoryType.replace(/([A-Z])/g, ' $1').trim()} Purchased!`;
                document.getElementById(`upgrade-${factoryType}`).disabled = false;
            } else {
                alert("You don't have enough beans to buy this factory!");
            }
        }

        // Start generating beans from a specific factory
        function startFactory(factoryType) {
            setInterval(() => {
                score += factoryGenerationRates[factoryType];
                scoreDisplay.textContent = "Score: " + score;
            }, 1000);  // Every second
        }

        // Upgrade Factory
        function upgradeFactory(factoryType) {
            if (score >= factoryUpgradeCosts[factoryType]) {
                score -= factoryUpgradeCosts[factoryType];
                factoryUpgradeLevels[factoryType]++;
                factoryGenerationRates[factoryType] *= 2;  // Double the generation rate
                scoreDisplay.textContent = "Score: " + score;

                // Update the UI with the new generation rate
                document.getElementById(`${factoryType}-rate`).textContent = factoryGenerationRates[factoryType];
                document.getElementById(`upgrade-${factoryType}`).disabled = true;
            } else {
                alert("You don't have enough beans to upgrade this factory!");
            }
        }
    </script>
</body>
</html>
