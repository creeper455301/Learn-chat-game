<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 500px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
    }
    .chat-display {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
      border-bottom: 1px solid #ccc;
    }
    .chat-message {
      margin-bottom: 10px;
      padding: 10px;
      background-color: #e0e0e0;
      border-radius: 5px;
      word-wrap: break-word;
      position: relative;
    }
    .chat-message span {
      font-weight: bold;
    }
    .chat-message .crown {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      color: gold;
    }
    .chat-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
    }
    .chat-input input {
      flex-grow: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-right: 10px;
    }
    .chat-input button {
      padding: 10px 20px;
      font-size: 16px;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .chat-input button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-display" id="chatDisplay">
      <!-- Chat messages will appear here -->
    </div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button id="sendButton">Send</button>
    </div>
  </div>

  <script>
    const chatDisplay = document.getElementById('chatDisplay');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');

    // List of messages
    let messages = [];

    // Function to add a message to the display
    function displayMessages() {
      chatDisplay.innerHTML = ''; // Clear previous messages
      messages.forEach(msg => {
        const messageElement = document.createElement('div');
        messageElement.classList.add('chat-message');
        
        // Check if the user is "CreeperDev" and add a crown
        if (msg.username === 'CreeperDev') {
          messageElement.innerHTML = `
            <div class="crown">👑</div>
            <span>${msg.username}:</span> ${msg.message}
          `;
        } else {
          messageElement.innerHTML = `
            <span>${msg.username}:</span> ${msg.message}
          `;
        }
        chatDisplay.appendChild(messageElement);
      });

      // Scroll to the bottom of the chat
      chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    // Function to send a message
    function sendMessage() {
      const messageText = messageInput.value.trim();
      if (messageText) {
        const username = prompt('Enter your username:') || 'Anonymous'; // Prompt for username
        messages.push({ username, message: messageText }); // Add message to the array
        messageInput.value = ''; // Clear the input field
        displayMessages(); // Update chat display
      }
    }

    // Event listener for the send button
    sendButton.addEventListener('click', sendMessage);

    // Event listener for pressing 'Enter' to send the message
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && messageInput.value.trim()) {
        sendMessage();
      }
    });

  </script>
</body>
</html>
